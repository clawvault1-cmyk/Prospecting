<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Ohio Desk{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <span class="mark">OH</span>
      <span>
        <strong>Ohio Desk</strong>
        <small>Toyota Automated Logistics</small>
      </span>
    </a>
    {% if mode %}
    <p class="mode" title="{{ mode.detail }}">{{ mode.label }}</p>
    {% endif %}
    {% if request.session.get('ok') %}
    <form method="post" action="/logout">
      <button class="text" type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
